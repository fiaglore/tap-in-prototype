# Runs the server's automated tests on every change under worker/.
name: Worker tests
on:
  workflow_dispatch:
  push:
    paths: ['worker/**', '.github/workflows/worker-tests.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/worker-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
