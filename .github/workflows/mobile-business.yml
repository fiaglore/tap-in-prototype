# Builds the Tap In Business phone app. Android runs whenever the mobile folder changes and leaves a debug APK to download.
name: Business app build

on:
  workflow_dispatch:
  push:
    paths: ['mobile-business/**', '.github/workflows/mobile-business.yml']
  pull_request:
    paths: ['mobile-business/**', '.github/workflows/mobile-business.yml']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-business/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept the Android SDK licences and install the platform the app targets
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: mobile-business/android
      - uses: actions/upload-artifact@v4
        with:
          name: tap-in-business-android-debug
          path: mobile-business/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

