<rect x="251" y="0" width="29" height="151" fill="#FFFFFF"/>
<path d="M280,0 H320 A53,53 0 0 1 320,106 H301 L285,76 H318 A25,25 0 0 0 318,26 H280 Z" fill="#FFFFFF"/>
<g transform="translate(99.5,191)">
<polygon class="press" points="0,0 31,0 31,26 0,38" fill="#B5A0CC"/>
<rect class="lit" x="0" y="44" width="31" height="107" fill="#B5A0CC"/>
